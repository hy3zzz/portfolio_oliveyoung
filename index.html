<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신혜원 포트폴리오 | UI/UX Designer</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242f; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script>
  // 모바일(터치 기기)이나 PDF 내장 뷰어가 없는 브라우저는 iframe 안에서 PDF가 잘려 보이므로
  // PDF 파일로 바로 이동해 기기 기본 뷰어로 열리게 한다
  var pdf = 'UIUX%EB%94%94%EC%9E%90%EC%9D%B8%28%EA%B8%80%EB%A1%9C%EB%B2%8C%29_%EC%8B%A0%ED%98%9C%EC%9B%90_%ED%8F%AC%ED%8A%B8%ED%8F%B4%EB%A6%AC%EC%98%A4.pdf';
  var touch = window.matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (touch || navigator.pdfViewerEnabled === false) location.replace(pdf);
</script>
</head>
<body>
<iframe src="UIUX%EB%94%94%EC%9E%90%EC%9D%B8%28%EA%B8%80%EB%A1%9C%EB%B2%8C%29_%EC%8B%A0%ED%98%9C%EC%9B%90_%ED%8F%AC%ED%8A%B8%ED%8F%B4%EB%A6%AC%EC%98%A4.pdf#view=FitH" title="신혜원 포트폴리오"></iframe>
</body>
</html>
